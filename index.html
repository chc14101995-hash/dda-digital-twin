<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b121b"><title>DDA · Digital Twin</title><link rel="stylesheet" href="style.css?v=decks2"></head>
<body><aside class="rail"><div class="logo">D<span>∷</span></div><div class="rail-label">DDA</div><button class="active" id="overview" title="Tổng quan">◈</button><button id="openImport" title="Nhập dữ liệu">⇧</button><button id="download" title="Xuất dữ liệu">⇩</button></aside>
<main><header><div><h1>Digital Twin <span>Workspace</span></h1></div><div class="header-actions"><button id="importTop">Nhập tiến độ</button><button class="primary" id="newCable">+ Tuyến cáp</button></div></header>
<section class="projectline"><span class="projectbadge">DDA</span><b>Giàn DDA · Tiến độ thi công EIT</b><span class="muted" id="source">Chưa nạp mô hình</span><label class="model-open">Mở mô hình<input type="file" id="modelFile" accept=".gz,.json" hidden></label></section>
<section id="kpis" class="kpis"></section>
<section class="workspace"><div class="visual"><div class="panelhead"><div><h2>Construction overview</h2></div><div class="viewer-actions"><button id="fit">Toàn cảnh</button><button id="top">Mặt bằng</button><button id="isolate">Cô lập</button></div></div><div class="viewpoint-toolbar"><label for="deckView">Viewpoint / Sàn</label><select id="deckView" aria-label="Viewpoint theo sàn"><option value="all">Toàn bộ giàn</option></select><select id="viewAngle" aria-label="Góc nhìn"><option value="iso">Phối cảnh</option><option value="top">Mặt bằng</option><option value="front">Mặt đứng</option><option value="right">Mặt bên</option></select><label class="floor-toggle"><input type="checkbox" id="floorOnly" checked disabled> Chỉ sàn đang chọn</label></div><div id="viewport"><canvas id="scene" aria-label="Mô hình 3D giàn DDA"></canvas><span id="modelCount" hidden></span><div id="loading">Đang tải không gian 3D…</div></div></div>
<aside class="detail"><div class="panelhead"><div><h2>Thông tin thi công</h2></div></div><div id="detailBody" class="detailbody"><div class="empty-symbol">⌖</div><h3>Chọn một đối tượng</h3></div></aside></section>
<section class="register"><div class="registerhead"><div><h2>Danh mục & tiến độ <span id="rowCount"></span></h2></div><div class="filters"><input id="search" placeholder="Tìm tag, ID, khu vực…" aria-label="Tìm đối tượng"><select id="groupFilter" aria-label="Nhóm"><option value="all">Tất cả nhóm</option><option value="support">Support EIT</option><option value="equipment">Thiết bị</option><option value="cable">Kéo cáp</option></select><select id="statusFilter" aria-label="Trạng thái"><option value="all">Tất cả trạng thái</option><option value="unknown">Chưa cập nhật</option><option value="todo">Chưa bắt đầu</option><option value="doing">Đang làm</option><option value="complete">Hoàn thành</option><option value="blocked">Bị vướng</option></select></div></div><div class="tablewrap"><table><thead><tr><th>TAG / MÃ ĐỐI TƯỢNG</th><th>NHÓM</th><th>KHU VỰC</th><th>KHỐI LƯỢNG</th><th>TIẾN ĐỘ</th><th>TRẠNG THÁI</th><th>LIÊN KẾT 3D</th></tr></thead><tbody id="rows"></tbody></table></div><div class="tablefoot"><span id="pagination"></span><div><button id="prev">Trước</button><button id="next">Sau</button></div></div></section>
</main>
<dialog id="modal"><div class="dialoghead"><h2 id="modalTitle">Nhập dữ liệu</h2><button id="closeModal" aria-label="Đóng">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=decks2"></script></body></html>
