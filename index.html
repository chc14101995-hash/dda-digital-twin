<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b121b"><title>KMDD · Digital Twin</title><link rel="stylesheet" href="style.css?v=floor26"></head>
<body>
<main><header><div><h1>KMDD</h1></div><div class="header-actions"><button id="importTop">Nhập tiến độ</button><button id="download">Xuất tiến độ</button><button class="primary" id="newCable">+ Tuyến cáp</button></div></header>
<section class="projectline"><select id="modelSelector" aria-label="Chọn mô hình" disabled><option>Đang tải mô hình…</option></select><span class="projectbadge" id="projectBadge">EIT</span><b id="projectTitle">Tiến độ thi công EIT</b><span class="muted" id="source">Chưa nạp mô hình</span><label class="model-open">Mở mô hình<input type="file" id="modelFile" accept=".gz,.json" hidden></label></section>
<div class="viewpoint-toolbar"><label for="deckView">Viewpoint / Sàn</label><select id="deckView" aria-label="Viewpoint theo sàn"><option value="all">Toàn bộ giàn</option></select><select id="viewAngle" aria-label="Góc nhìn"><option value="iso">Phối cảnh</option><option value="top">Mặt bằng</option><option value="front">Mặt đứng</option><option value="right">Mặt bên</option></select><label class="floor-toggle"><input type="checkbox" id="floorOnly" checked disabled> Chỉ sàn đang chọn</label></div>
<section id="kpis" class="kpis"></section>
<section class="support-progress" aria-label="Thống kê support theo sàn"><div class="progress-heading"><h2 id="progressTitle">Support theo sàn</h2></div><div id="progressCards" class="progress-cards"></div></section>
<section class="workspace"><div class="visual"><div class="panelhead"><div><h2>Construction overview</h2></div><div class="viewer-actions"><button id="fit">Toàn cảnh</button><button id="top">Mặt bằng</button><button id="isolate">Cô lập</button></div></div><div class="layer-toolbar"><label><input type="checkbox" id="showStructure" checked> Structure</label><label><input type="checkbox" id="showPiping" checked> Piping</label><label class="opacity-control" for="bgOpacity">Độ hiện nền <input id="bgOpacity" type="range" min="0" max="35" value="12" step="1"><output id="bgOpacityValue">12%</output></label></div><div id="viewport"><canvas id="scene" aria-label="Mô hình 3D giàn DDA"></canvas><span id="modelCount" hidden></span><div id="loading">Đang tải không gian 3D…</div></div></div>
<aside class="detail"><div class="panelhead"><div><h2>Thông tin thi công</h2></div></div><div id="detailBody" class="detailbody"><div class="empty-symbol">⌖</div><h3>Chọn một đối tượng</h3></div></aside></section>
<section class="register"><div class="registerhead"><div><h2>Danh mục & tiến độ <span id="rowCount"></span></h2></div><div class="filters"><input id="search" placeholder="Tìm tag, ID, khu vực…" aria-label="Tìm đối tượng"><select id="groupFilter" aria-label="Nhóm"><option value="all">Tất cả nhóm</option><option value="support">Support EIT</option><option value="tray_support">Support thang máng</option><option value="equipment">Thiết bị</option><option value="cable">Kéo cáp</option></select><select id="stageFilter" aria-label="Mốc tiến độ support"><option value="all">Tất cả các mốc</option><option value="pending_fabricated">Chưa chế tạo</option><option value="pending_installed">Chưa lắp đặt</option><option value="pending_full_welded">Chưa hàn full</option><option value="blocked">Bị vướng</option></select><select id="statusFilter" aria-label="Trạng thái"><option value="all">Tất cả trạng thái</option><option value="unknown">Chưa cập nhật</option><option value="todo">Chưa bắt đầu</option><option value="doing">Đang làm</option><option value="complete">Hoàn thành</option><option value="blocked">Bị vướng</option></select></div></div><div class="filtered-actions"><span id="filterSummary"></span><button id="exportFiltered" disabled>Xuất Excel danh sách</button></div><div class="tablewrap"><table><thead><tr><th>TAG / MÃ ĐỐI TƯỢNG</th><th>NHÓM</th><th>KHU VỰC</th><th>KHỐI LƯỢNG</th><th>TIẾN ĐỘ</th><th>TRẠNG THÁI</th><th class="stage-fabricated">CHẾ TẠO</th><th class="stage-installed">LẮP ĐẶT</th><th class="stage-full_welded">HÀN FULL</th><th class="stage-blocked">VƯỚNG</th><th>LIÊN KẾT 3D</th></tr></thead><tbody id="rows"></tbody></table></div><div class="tablefoot"><span id="pagination"></span><div><button id="prev">Trước</button><button id="next">Sau</button></div></div></section>
</main>
<dialog id="modal"><div class="dialoghead"><h2 id="modalTitle">Nhập dữ liệu</h2><button id="closeModal" aria-label="Đóng">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=floor26"></script></body></html>
